apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/iamsal-90/enterprise-devops-platform-cloudnative.git'
        revision: develop
        directories:
          - path: gitops/apps/*
          - path: gitops/apps/*/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/iamsal-90/enterprise-devops-platform-cloudnative.git'
        targetRevision: develop
        path: '{{path}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
